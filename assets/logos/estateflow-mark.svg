<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="towerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="2" y="2" width="508" height="508" rx="126" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Center Graphic Icon Group -->
  <g transform="translate(256, 235) scale(2.2) translate(-100, -100)">
    <!-- Architectural Towers -->
    <!-- Left Tower -->
    <path d="M 64 122 L 64 82 L 86 64 L 86 122 Z" fill="#64748B" />
    <rect x="71" y="78" width="4" height="6" rx="1" fill="#0F172A" opacity="0.6"/>
    <rect x="71" y="90" width="4" height="6" rx="1" fill="#0F172A" opacity="0.6"/>
    <rect x="71" y="102" width="4" height="6" rx="1" fill="#0F172A" opacity="0.6"/>

    <!-- Main Center High-Rise -->
    <path d="M 88 122 L 88 40 L 118 16 L 118 122 Z" fill="url(#towerGrad)" />
    <!-- Windows Matrix -->
    <rect x="95" y="44" width="6" height="8" rx="1" fill="#0F172A" opacity="0.85"/>
    <rect x="95" y="60" width="6" height="8" rx="1" fill="#0F172A" opacity="0.85"/>
    <rect x="95" y="76" width="6" height="8" rx="1" fill="#0F172A" opacity="0.85"/>
    <rect x="95" y="92" width="6" height="8" rx="1" fill="#0F172A" opacity="0.85"/>
    
    <rect x="105" y="52" width="6" height="8" rx="1" fill="#0F172A" opacity="0.85"/>
    <rect x="105" y="68" width="6" height="8" rx="1" fill="#0F172A" opacity="0.85"/>
    <rect x="105" y="84" width="6" height="8" rx="1" fill="#0F172A" opacity="0.85"/>
    <rect x="105" y="100" width="6" height="8" rx="1" fill="#0F172A" opacity="0.85"/>

    <!-- Right Tower -->
    <path d="M 120 122 L 120 58 L 142 74 L 142 122 Z" fill="#94A3B8" />
    <rect x="127" y="76" width="4" height="6" rx="1" fill="#0F172A" opacity="0.6"/>
    <rect x="127" y="88" width="4" height="6" rx="1" fill="#0F172A" opacity="0.6"/>
    <rect x="127" y="100" width="4" height="6" rx="1" fill="#0F172A" opacity="0.6"/>

    <!-- Left Roofline (Gable Silhouette) -->
    <path d="M 38 112 L 64 88 L 64 102 L 48 118 Z" fill="#F8FAFC"/>

    <!-- Dynamic Infinity Flow Ribbon (Outer Glow & Streamline) -->
    <path d="M 40 120 C 40 152, 70 172, 102 172 C 146 172, 172 134, 172 106 C 172 82, 152 70, 134 70 C 108 70, 90 108, 72 134 C 58 156, 38 152, 34 136 C 30 120, 42 106, 60 94" 
          fill="none" stroke="url(#flowGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Inner Accent Flow Core -->
    <path d="M 46 124 C 44 144, 66 158, 92 158 C 128 158, 156 126, 156 104 C 156 90, 144 82, 132 82 C 114 82, 98 112, 82 136 C 72 150, 60 148, 54 138" 
          fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Subtle bottom caption -->
  <text x="256" y="445" text-anchor="middle" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="8" fill="#F8FAFC">
    ESTATEFLOW
  </text>
</svg>