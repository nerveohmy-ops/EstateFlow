<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="efGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <linearGradient id="efGradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- LOGO ICON (Infinity Skyline / Architectural Flow) -->
  <g transform="translate(40, 20)">
    <!-- Base Glow/Container -->
    <rect width="200" height="200" rx="36" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    
    <!-- Real Estate Towers + Continuous Flow Ribbon -->
    <g transform="translate(100, 100) scale(0.85) translate(-100, -100)">
      <!-- Left Building -->
      <path d="M 62 120 L 62 82 L 86 64 L 86 120 Z" fill="#334155" />
      <rect x="70" y="78" width="4" height="6" rx="1" fill="#FFFFFF" opacity="0.9"/>
      <rect x="70" y="90" width="4" height="6" rx="1" fill="#FFFFFF" opacity="0.9"/>
      <rect x="70" y="102" width="4" height="6" rx="1" fill="#FFFFFF" opacity="0.9"/>

      <!-- Center Skyscraper (Main Tower) -->
      <path d="M 88 120 L 88 42 L 118 20 L 118 120 Z" fill="#0F172A" />
      <rect x="96" y="44" width="5" height="8" rx="1" fill="#FFFFFF" opacity="0.95"/>
      <rect x="96" y="60" width="5" height="8" rx="1" fill="#FFFFFF" opacity="0.95"/>
      <rect x="96" y="76" width="5" height="8" rx="1" fill="#FFFFFF" opacity="0.95"/>
      <rect x="96" y="92" width="5" height="8" rx="1" fill="#FFFFFF" opacity="0.95"/>
      <rect x="105" y="52" width="5" height="8" rx="1" fill="#FFFFFF" opacity="0.95"/>
      <rect x="105" y="68" width="5" height="8" rx="1" fill="#FFFFFF" opacity="0.95"/>
      <rect x="105" y="84" width="5" height="8" rx="1" fill="#FFFFFF" opacity="0.95"/>

      <!-- Right Building -->
      <path d="M 120 120 L 120 58 L 142 74 L 142 120 Z" fill="#475569" />
      <rect x="128" y="76" width="4" height="6" rx="1" fill="#FFFFFF" opacity="0.9"/>
      <rect x="128" y="88" width="4" height="6" rx="1" fill="#FFFFFF" opacity="0.9"/>
      <rect x="128" y="100" width="4" height="6" rx="1" fill="#FFFFFF" opacity="0.9"/>

      <!-- House Gable Peak Silhouette (Left Roofline) -->
      <path d="M 36 112 L 62 88 L 62 102 L 46 118 Z" fill="#0F172A"/>

      <!-- Dynamic Flow Ribbon / Mobius Loop -->
      <path d="M 42 118 C 42 148, 70 168, 102 168 C 145 168, 168 132, 168 106 C 168 84, 150 72, 134 72 C 108 72, 92 108, 74 134 C 60 154, 42 152, 38 138 C 34 124, 44 110, 60 98" 
            fill="none" stroke="#0F172A" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Flow accent inner line -->
      <path d="M 52 128 C 50 142, 64 154, 86 154 C 120 154, 152 122, 152 102 C 152 88, 142 82, 132 82 C 114 82, 98 112, 82 136 C 72 150, 60 148, 56 138" 
            fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- TYPOGRAPHY / WORDMARK -->
  <g transform="translate(270, 78)">
    <!-- Brand Title -->
    <text x="0" y="46" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="54" font-weight="800" letter-spacing="-0.5" fill="#0F172A">
      Estate<tspan fill="#2563EB">Flow</tspan>
    </text>
    
    <!-- Divider / Flow Indicator -->
    <circle cx="282" cy="38" r="4" fill="#2563EB"/>
    
    <!-- Subtitle / Tagline -->
    <text x="2" y="80" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" letter-spacing="3.5" fill="#64748B" text-transform="uppercase">
      REAL ESTATE INTELLIGENCE &amp; CRM
    </text>

    <!-- Micro badge / Status -->
    <g transform="translate(2, 98)">
      <rect width="186" height="24" rx="6" fill="#F1F5F9"/>
      <circle cx="12" cy="12" r="3.5" fill="#10B981"/>
      <text x="22" y="16.5" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#475569" letter-spacing="0.5">
        УЧЁТ ОПЕРАЦИЙ &amp; СДЕЛОК
      </text>
    </g>
  </g>
</svg>