<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyanBlueFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Dark Background Plate -->
  <rect width="800" height="240" rx="24" fill="url(#darkBg)" stroke="#1F2937" stroke-width="2"/>

  <!-- LOGO ICON (Left) -->
  <g transform="translate(45, 20)">
    <rect width="200" height="200" rx="36" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    
    <g transform="translate(100, 100) scale(0.85) translate(-100, -100)">
      <!-- Left Tower -->
      <path d="M 62 120 L 62 82 L 86 64 L 86 120 Z" fill="#475569" />
      <rect x="70" y="78" width="4" height="6" rx="1" fill="#0B0F19"/>
      <rect x="70" y="90" width="4" height="6" rx="1" fill="#0B0F19"/>
      <rect x="70" y="102" width="4" height="6" rx="1" fill="#0B0F19"/>

      <!-- Center Tower -->
      <path d="M 88 120 L 88 42 L 118 20 L 118 120 Z" fill="#F8FAFC" />
      <rect x="96" y="44" width="5" height="8" rx="1" fill="#0F172A"/>
      <rect x="96" y="60" width="5" height="8" rx="1" fill="#0F172A"/>
      <rect x="96" y="76" width="5" height="8" rx="1" fill="#0F172A"/>
      <rect x="96" y="92" width="5" height="8" rx="1" fill="#0F172A"/>
      <rect x="105" y="52" width="5" height="8" rx="1" fill="#0F172A"/>
      <rect x="105" y="68" width="5" height="8" rx="1" fill="#0F172A"/>
      <rect x="105" y="84" width="5" height="8" rx="1" fill="#0F172A"/>

      <!-- Right Tower -->
      <path d="M 120 120 L 120 58 L 142 74 L 142 120 Z" fill="#64748B" />
      <rect x="128" y="76" width="4" height="6" rx="1" fill="#0B0F19"/>
      <rect x="128" y="88" width="4" height="6" rx="1" fill="#0B0F19"/>
      <rect x="128" y="100" width="4" height="6" rx="1" fill="#0B0F19"/>

      <!-- House Silhouette Left -->
      <path d="M 36 112 L 62 88 L 62 102 L 46 118 Z" fill="#FFFFFF"/>

      <!-- Dynamic Flow Ribbon -->
      <path d="M 42 118 C 42 148, 70 168, 102 168 C 145 168, 168 132, 168 106 C 168 84, 150 72, 134 72 C 108 72, 92 108, 74 134 C 60 154, 42 152, 38 138 C 34 124, 44 110, 60 98" 
            fill="none" stroke="url(#cyanBlueFlow)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Inner crisp highlight line -->
      <path d="M 52 128 C 50 142, 64 154, 86 154 C 120 154, 152 122, 152 102 C 152 88, 142 82, 132 82 C 114 82, 98 112, 82 136 C 72 150, 60 148, 56 138" 
            fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    </g>
  </g>

  <!-- TYPOGRAPHY / WORDMARK (Right) -->
  <g transform="translate(280, 78)">
    <text x="0" y="46" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-size="54" font-weight="800" letter-spacing="-0.5" fill="#F8FAFC">
      Estate<tspan fill="#38BDF8">Flow</tspan>
    </text>
    
    <text x="2" y="80" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="3.5" fill="#94A3B8" text-transform="uppercase">
      REAL ESTATE INTELLIGENCE &amp; CRM
    </text>

    <g transform="translate(2, 98)">
      <rect width="210" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#34D399"/>
      <text x="22" y="16.5" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#CBD5E1" letter-spacing="0.5">
        УЧЁТ РИЭЛТОРСКИХ ОПЕРАЦИЙ
      </text>
    </g>
  </g>
</svg>